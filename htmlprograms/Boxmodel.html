<head>

    <style>
        .box {
            width: 300px;
            padding: 20px;
            border: 5px solid rgb(131, 131, 159);
            margin: 30px;
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <div class="box">
        Hello Students1
    </div>
    <div class="box">
        Hello Students2
    </div>
    <div class="box">
        Hello Students3
    </div>
    <div class="box">
        Hello Students4
    </div>

</body>
</html>
