<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            background-color: rgb(182, 255, 254);
            text-align: center;
        }
        form {
            background-color: white;
            width: 300px;
            padding: 20px;
            margin: 100px auto;
            border: 2px solid rgb(26, 24, 26);
        }
        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
        }
        button {
            background-color: rgb(13, 13, 13);
            color: white;
            padding: 10px 30px;
            border: none;
        }
        a {
            color: rgb(12, 10, 12);
        }
/*  */
    </style>
</head>
<body>
    <form>
        <h1>Login</h1>
        <input type="text" placeholder="Username">
        <br>
        <input type="password" placeholder="Password">
        <br>
        <button>Login</button>
        <p>Don't have an account?</p>
        <a href="#">Register</a>
    </form>
</body>

</html>
