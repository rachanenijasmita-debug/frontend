<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Example</title>

    <style>
        .container {
            display: flex;
            flex-direction: column;
            
        }

        .box {
            width: 100px;
            height: 100px;
            margin: 10px;
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>

    </div>

</body>
</html>
