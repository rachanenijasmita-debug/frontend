<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Website</title>
    <link rel="stylesheet" href="lab5.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            ShopEasy
        </div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Offers</a>
            <a href="#">Contact</a>
        </div>
        <div class="cart">
            🛒 Cart
        </div>
    </nav>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Welcome to ShopEasy</h1>
            <p>
                Discover amazing products at the best prices.
            </p>
            <button class="shop-button">
                Shop Now
            </button>
        </div>
    </section>
    <!-- Products Section -->
    <section class="products">
        <h2>Our Products</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="product-image">📱</div>
                <h3>Smart Phone</h3>
                <p>₹20,000</p>
                <button>Buy Now</button>
            </div>
            <div class="product-card">
                <div class="product-image">💻</div>
                <h3>Laptop</h3>
                <p>₹55,000</p>
                <button>Buy Now</button>
            </div>
            <div class="product-card">
                <div class="product-image">🎧</div>
                <h3>Headphones</h3>
                <p>₹2,000</p>
                <button>Buy Now</button>
            </div>
            <div class="product-card">
                <div class="product-image">⌚</div>
                <h3>Smart Watch</h3>
                <p>₹3,500</p>
                <button>Buy Now</button>
            </div>
        </div>
    </section>
    <!-- Footer -->
    <footer>
        <p>© 2026 ShopEasy. All Rights Reserved.</p>
    </footer>
</body>
</html>
