<!DOCTYPE html>
<html>
<head>
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="lab6.css">
</head>

<body>

    <div class="container">

        <h1>Student Result Management System</h1>

        <form id="resultForm">

            <label>Student Name:</label>
            <input type="text" id="name" required>

            <label>Roll Number:</label>
            <input type="text" id="roll" required>

            <label>Mathematics:</label>
            <input type="number" id="maths" min="0" max="100" required>

            <label>Physics:</label>
            <input type="number" id="physics" min="0" max="100" required>

            <label>Chemistry:</label>
            <input type="number" id="chemistry" min="0" max="100" required>

            <label>Computer Science:</label>
            <input type="number" id="computer" min="0" max="100" required>

            <label>English:</label>
            <input type="number" id="english" min="0" max="100" required>

            <button type="submit">Calculate Result</button>
            <button type="reset">Clear</button>

        </form>

        <h2>Student Result</h2>

        <table id="resultTable">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Total</th>
                    <th>Percentage</th>
                    <th>Grade</th>
                    <th>Result</th>
                </tr>
            </thead>

            <tbody id="resultBody">
            </tbody>

        </table>

    </div>

    <script src="lab6.js"></script>

</body>
</html>
