<!DOCTYPE html>
<html>
<head>
    <title>Weather Information Dashboard</title>
    <link rel="stylesheet" href="lab7.css">
</head>

<body>

    <div class="container">

        <h1>Weather Information Dashboard</h1>

        <!-- Search Section -->
        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchButton">
                Search
            </button>

        </div>

        <!-- Error Message -->
        <p id="errorMessage"></p>

        <!-- Weather Information -->
        <div id="weatherBox" class="weather-box">

            <h2 id="cityName">City Name</h2>

            <img id="weatherIcon" src="" alt="Weather Icon">

            <h3 id="temperature">-- °C</h3>

            <p id="condition">Weather Condition</p>

            <div class="weather-details">

                <p>
                     Humidity:
                    <span id="humidity">--</span>%
                </p>

                <p>
                     Wind Speed:
                    <span id="wind">--</span> m/s
                </p>

            </div>

        </div>

    </div>

    <script src="lab7.js"></script>

</body>
</html>
